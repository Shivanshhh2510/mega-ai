

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mega_ai}
      POSTGRES_USER: ${POSTGRES_USER:-mega}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mega_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mega}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mega}:${POSTGRES_PASSWORD:-mega_secret}@db:5432/${POSTGRES_DB:-mega_ai}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-mega}:${POSTGRES_PASSWORD:-mega_secret}@db:5432/${POSTGRES_DB:-mega_ai}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mega}:${POSTGRES_PASSWORD:-mega_secret}@db:5432/${POSTGRES_DB:-mega_ai}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-mega}:${POSTGRES_PASSWORD:-mega_secret}@db:5432/${POSTGRES_DB:-mega_ai}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: python -m app.worker

  log-viewer:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mega.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db

volumes:
  pgdata:
